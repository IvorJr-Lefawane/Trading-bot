name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # All three suites are offline: no network, no API keys, no secrets needed.
      - name: Guardrail tests
        run: npm run guardrail:test

      - name: Failure-injection tests
        run: npm run failure:test

      - name: Donchian logic tests
        run: npm run donchian:test
